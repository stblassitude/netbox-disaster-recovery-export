name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && pip install .[pdf,dev]

      - name: Check that the package imports and the CLI runs
        run: |
          python -c "import ndre"
          ndre --help

      - name: Run test suite
        if: hashFiles('tests/**') != ''
        run: |
          pip install pytest
          pytest

      - name: Build distribution
        run: |
          pip install build
          python -m build
